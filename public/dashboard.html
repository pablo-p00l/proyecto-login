<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-card">
    <h1 class="auth-title">Panel</h1>
    <p class="auth-subtitle" id="bienvenida">Cargando tu información...</p>

    <div id="mensaje"></div>

    <div id="datosUsuario" style="display: none;">
      <div class="mb-3">
        <span class="form-label d-block">Usuario</span>
        <span id="campoUsername"></span>
      </div>
      <div class="mb-3">
        <span class="form-label d-block">Email</span>
        <span id="campoEmail"></span>
      </div>
      <div class="mb-4">
        <span class="form-label d-block">Rol</span>
        <span id="campoRole"></span>
      </div>

      <button id="btnLogout" class="btn-google w-100">Cerrar sesión</button>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
