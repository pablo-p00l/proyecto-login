<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de administración</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-card admin-card">
    <h1 class="auth-title">Administración</h1>
    <p class="auth-subtitle">Usuarios registrados en el sistema</p>

    <div id="mensaje"></div>

    <div class="table-responsive">
      <table class="table tabla-admin">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Origen</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tablaUsuarios"></tbody>
      </table>
    </div>

    <a href="dashboard.html" class="btn-google mt-4">Volver al panel</a>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
